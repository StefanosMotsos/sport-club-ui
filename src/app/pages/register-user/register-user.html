<main class="main d-flex align-items-center justify-content-center">
  <form class="form-card py-4 w-100 d-flex flex-column">
    <h1 class="fs-4 fw-bold text-purple mb-3">Register User</h1>
    <div class="d-flex flex-column g-2 mb-3">
      <label class="label-field text-muted">USERNAME</label>
      <input type="text" class="text-secondary p-1">
    </div>
    <div class="d-flex flex-column g-1 mb-3">
      <label class="label-field text-muted">PASSWORD</label>
      <input type="text" class="text-secondary p-1">
    </div>
    <div class="d-flex flex-column g-1 mb-4">
      <label class="label-field text-muted">ROLE</label>
      <select class="p-1">
        <option value="" disabled selected>Select Role:</option>
        <option value="2">EMPLOYEE</option>
        <option value="1">ADMIN</option>
      </select>
    </div>
    <mat-divider/>
    <button matButton="filled" class="mt-4">Submit</button>
  </form>
</main>
