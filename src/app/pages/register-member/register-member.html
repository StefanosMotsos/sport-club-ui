<main class="main d-flex align-items-center justify-content-center">
  <form class="form-card-wide py-4 w-100 d-flex flex-column">
    <h1 class="fs-1 fw-bold text-purple mb-5 text-decoration-underline">Register Member</h1>
    <div class="container mb-5">
      <h2 class="fs-5 text-purple">Member Info</h2>
      <div class="row g-3">
        <div class="col-md-4 d-flex flex-column gap-1">
          <label class="label-field text-muted">FIRST NAME</label>
          <input type="text" class="text-secondary p-1 w-75">
        </div>
        <div class="col-md-4 d-flex flex-column gap-1">
          <label class="label-field text-muted">LAST NAME</label>
          <input type="text" class="text-secondary p-1 w-75">
        </div>
        <div class="col-md-4 d-flex flex-column gap-1">
          <label class="label-field text-muted">VAT</label>
          <input type="text" class="text-secondary p-1 w-75">
        </div>
        <div class="col-md-4 d-flex flex-column gap-1">
          <label class="label-field text-muted">SPORT</label>
          <select class="p-1 w-75">
            <option value="" disabled selected>Select Sport:</option>
            <option value="2">football (temp)</option>
            <option value="1">basketball (temp)</option>
          </select>
        </div>
        <div class="col-md-4 d-flex flex-column gap-1">
          <label class="label-field text-muted">MEMBERSHIP TYPE:</label>
          <select class="p-1 w-75">
            <option value="" disabled selected>Select Membership:</option>
            <option value="2">free (temp)</option>
            <option value="1">extended (temp)</option>
          </select>
        </div>
      </div>
      <h2 class="fs-5 text-purple mt-5">Personal Info</h2>
      <div class="row g-3">
        <div class="col-md-4 d-flex flex-column gap-1">
          <label class="label-field text-muted">MEMBERSHIP ID</label>
          <input type="text" class="text-secondary p-1 w-75">
        </div>
        <div class="col-md-4 d-flex flex-column gap-1">
          <label class="label-field text-muted">IDENTITY NUMBER</label>
          <input type="text" class="text-secondary p-1 w-75">
        </div>
        <div class="col-md-4 d-flex flex-column gap-1">
          <label class="label-field text-muted">PLACE OF BIRTH</label>
          <input type="text" class="text-secondary p-1 w-75">
        </div>
        <div class="col-md-4 d-flex flex-column gap-1">
          <label class="label-field text-muted">BRANCH OF REGISTRATION</label>
          <input type="text" class="text-secondary p-1 w-75">
        </div>
      </div>
      <h2 class="fs-5 text-purple mt-5">Account Credentials</h2>
      <div class="row g-3">
        <div class="col-md-6 d-flex flex-column gap-1">
          <label class="label-field text-muted">USERNAME</label>
          <input type="text" class="text-secondary p-1 w-75">
        </div>
        <div class="col-md-6 d-flex flex-column gap-1">
          <label class="label-field text-muted">PASSWORD</label>
          <input type="text" class="text-secondary p-1 w-75">
        </div>
      </div>
    </div>
    <mat-divider/>
    <div class="d-flex justify-content-center mt-4 px-5">
      <button matButton="filled" class="px-5 w-25">Submit</button>
    </div>
  </form>
</main>
