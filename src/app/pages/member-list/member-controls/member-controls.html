<div class="d-flex align-items-center justify-content-center py-2 gap-1 filter-border">
  <mat-icon class="text-purple">tune</mat-icon>
  <span>Filters</span>
</div>
<mat-divider class="mt-3"></mat-divider>
<button matButton="outlined" class="w-100 my-3 fw-semibold" (click)="clearFilters()">CLEAR FILTERS</button>
<div class="d-flex flex-column gap-2">
  <span class="label-field">SPORT</span>
  <ul class="d-flex flex-column gap-2 overflow-y-auto list-unstyled ps-3 mb-3" style="max-height: 144px;">
    @for (sport of sports; track sport.id) {
      <li class="d-flex align-items-center text-purple fw-medium fs-6">
        <input type="radio" name="sport" [value]="sport.name" (change)="onSelectionChange('sport', $any($event.target).value)">
        <span>{{ sport.name }}</span>
      </li>
    }
  </ul>
</div>
<div class="d-flex flex-column gap-2">
  <label class="label-field">VAT</label>
  <input type="text"(input)="onSelectionChange('vat', $any($event.target).value)">
</div>
<div class="d-flex flex-column gap-2 mt-3">
  <label class="label-field">MEMBERSHIP ID</label>
  <input type="text"(input)="onSelectionChange('membershipId', $any($event.target).value)">
</div>
