<main class="main d-flex flex-column p-3">
  <div class="d-flex w-100 gap-5 overflow-hidden mt-4">

    <div class="flex-shrink-0" style="width: 220px;">
      <app-member-controls (filtersChange)="loadMembers($event)"></app-member-controls>
    </div>

    <div class="flex-grow-1 d-flex flex-column">
      @if (errorMessage) {
        <div class="alert alert-danger py-2 mb-3">{{ errorMessage }}</div>
      }
      <div class="table-border">
        <table mat-table [dataSource]="members" class="w-100">

          <ng-container matColumnDef="no">
            <th mat-header-cell *matHeaderCellDef class="text-purple fw-semibold">No</th>
            <td mat-cell *matCellDef="let member; let i = index">{{ getRowNumber(i) }}</td>
          </ng-container>

          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef class="text-purple fw-semibold">Name</th>
            <td mat-cell *matCellDef="let member">{{member.firstname}} {{member.lastname}}</td>
          </ng-container>

          <ng-container matColumnDef="sport">
            <th mat-header-cell *matHeaderCellDef class="text-purple fw-semibold">Sport</th>
            <td mat-cell *matCellDef="let member">{{member.sport}}</td>
          </ng-container>

          <ng-container matColumnDef="membershipType">
            <th mat-header-cell *matHeaderCellDef class="text-purple fw-semibold">Type</th>
            <td mat-cell *matCellDef="let member">{{member.membershipType}}</td>
          </ng-container>

          <ng-container matColumnDef="activity">
            <th mat-header-cell *matHeaderCellDef class="text-purple fw-semibold">Activity</th>
            <td mat-cell *matCellDef="let member">{{member.activity}}</td>
          </ng-container>

          <ng-container matColumnDef="more">
            <th mat-header-cell *matHeaderCellDef class="text-purple fw-semibold">More</th>
            <td mat-cell *matCellDef="let member">
              <button matIconButton (click)="router.navigate(['/members', member.uuid])">
                <mat-icon>arrow_outward</mat-icon>
              </button>
            </td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef class="text-purple fw-semibold">Actions</th>
            <td mat-cell *matCellDef="let member">
              @if (userService.user()?.role === 'ADMIN') {
                <button matIconButton (click)="router.navigate(['/members', member.uuid, 'edit'])">
                  <mat-icon class="text-success">edit</mat-icon>
                </button>
                <button matIconButton (click)="onDelete(member.uuid)">
                  <mat-icon class="text-danger">delete</mat-icon>
                </button>
                <button matIconButton (click)="router.navigate(['/register', member.uuid, 'add-file'])">
                  <mat-icon class="text-purple">attach_file</mat-icon>
                </button>
              }
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>

        <mat-paginator [length]="totalElements"
                       [pageSize]="5"
                       aria-label="Select page">
        </mat-paginator>
      </div>
    </div>

  </div>
</main>
